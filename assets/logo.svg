  <text x="150" y="65" font-family="'Big Shoulders Display', Arial Narrow, Arial, sans-serif" font-weight="800" font-size="42" letter-spacing="-.5" fill="#101a14">GOLFBALL<tspan fill="#e6402c">DEALS</tspan></text>
  <text x="151" y="92" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="15" fill="#4f7a63" letter-spacing="2">UK PRICES &#183; RANKED DAILY</text>
