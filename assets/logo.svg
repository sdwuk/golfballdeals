    <rect x="21" y="6" width="5" height="88" rx="2.5" fill="#101a14"/>
    <path d="M26 10 L86 38 L26 66 Z" fill="#e6402c"/>
    <circle cx="45" cy="38" r="7" fill="#f3f5ef"/>
  </g>

